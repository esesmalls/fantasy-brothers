<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>H · 侧身与比例修订</title>
<style>
:root{color-scheme:dark;font-family:"Microsoft YaHei",sans-serif;background:#111b19;color:#e8dcc4}*{box-sizing:border-box}body{margin:0}main{max-width:1460px;margin:auto;padding:28px}header{display:flex;align-items:center;justify-content:space-between;gap:24px;border-bottom:1px solid #826644;padding-bottom:22px}h1{font:600 clamp(24px,3vw,38px) Georgia,"Microsoft YaHei",serif;margin:8px 0}small,.note{color:#afa995;line-height:1.7}nav,.controls{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}button,select{font:inherit;color:#ecdfc6;background:#283b32;border:1px solid #736749;border-radius:5px;padding:10px 16px;cursor:pointer}button[aria-pressed=true]{background:#695336;border-color:#d2b277}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #edc681;outline-offset:3px}figure{margin:0;border:1px solid #64593f;background:#293930;border-radius:8px;overflow:hidden}figure img{width:100%;display:block}figcaption{padding:13px 18px;color:#baae96;border-top:1px solid #64593f}label{display:flex;align-items:center;gap:9px}input[type=range]{flex:1;min-width:150px;accent-color:#d2b277}.controls{align-items:center}output{min-width:70px;color:#cab483}.detail{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:28px}.detail img{width:100%}a{color:#d4bb86}h2{font-size:20px}section[hidden]{display:none}@media(max-width:700px){main{padding:14px}header{display:block}.detail{grid-template-columns:1fr}button,select{padding:9px}.note{font-size:13px}}
</style>
<main>
<header><div><small>FANTASY BROTHERS / ART REVIEW · 2026.09.20</small><h1>H · 侧身与比例修订</h1><span class="note">头肩同向 · 自然短袖 · 轻底座 · 更清楚的武器</span></div><div class="note">一人 / 两甲 / 三类武器<br>本页为 Windows 实机帧回放<br>交互与示意音效：运行 Review-Static-Bust.cmd</div></header>
<nav aria-label="评审内容"><button data-tab="comparison" aria-pressed="true">同尺寸前后对照</button><button data-tab="gallery" aria-pressed="false">穿戴与伤损</button><button data-tab="motion" aria-pressed="false">武器动作</button><button data-tab="layers" aria-pressed="false">头身与衣甲分层</button></nav>
<section id="comparison"><figure><img id="compare" src="previews/comparison.png" alt="上排上一版，下排本次修订，镜头比例完全相同"><figcaption>上排是上一版，下排是本次修订。同一镜头倍率：头部缩小、肩胸转向、保留短上臂，底座减轻、武器放大。可切换其他标签检查实际穿戴与动作。</figcaption></figure></section>
<section id="gallery" hidden><div class="controls"><label>检查画面 <select id="appearance"><option value="overview-battle">完好 · 苔绿底</option><option value="overview-light">完好 · 浅底</option><option value="overview-deep">完好 · 深底</option><option value="overview-damaged">甲损＋伤势</option></select></label></div><figure><img id="overview" src="previews/overview-battle.png" alt="H 半身：内衬、绗缝、链甲和剑盾、枪、弓"><figcaption>上排检查穿戴，下面检查武器比例。脸部受伤和装备破损在实机中可以分别切换。</figcaption></figure></section>
<section id="motion" hidden><div class="controls"><label>武器 <select id="weapon"><option value="sword">剑盾</option><option value="spear">长枪</option><option value="bow">短弓</option></select></label><button id="play">播放</button><button id="restart">回到起点</button><label>速度 <select id="speed"><option value=".5">0.5×</option><option selected value="1">1×</option><option value="2">2×</option></select></label><input id="scrub" aria-label="动作帧" type="range" min="0" max="31" value="0"><output id="frame">01 / 32</output></div><figure><img id="movie" src="previews/sword-00.png" alt="实际导出包的逐帧武器动作"><figcaption>头、胸和衣甲静止；剑短挥、枪前刺、箭矢离弦，目标作为完整棋子短促后退。右下角为 1× 尺寸。</figcaption></figure><div class="detail"><figure><img id="block" src="previews/sword-block.png" alt="格挡结果"><figcaption>格挡：目标保留完好甲。</figcaption></figure><figure><img id="miss" src="previews/sword-miss.png" alt="落空结果"><figcaption>落空：没有命中效果或甲损。</figcaption></figure></div></section>
<section id="layers" hidden><figure><img src="previews/layers.png" alt="底座、身体、头、内衬与两层护甲的独立部件"><figcaption>头部与身体分开。肩胸和面容朝同一侧，短袖自然下垂，大臂略伸出底座两侧。</figcaption></figure><div class="detail"><figure><img src="previews/layers-damaged.png" alt="受伤和破损独立图层"><figcaption>头部伤势和材质破损采用独立原画。</figcaption></figure><figure><img src="previews/body-template.png" alt="素色内衣身体模板合成"><figcaption>基础身体穿素色贴身内衣，提供颈根和短上臂；外层衣甲独立叠加。</figcaption></figure></div></section>
<p class="note">本次沿用已认可的静态穿戴与武器节奏，修订比例与侧身构图；尚未覆盖完整人物库、多朝向、倒伏和死亡资产。样板待你评审。<a href="README.md">范围与来源</a> · <a href="QA.md">验证记录</a> · <a href="prompts.md">生成提示词</a> · <a href="../2026-09-20-static-bust/index.html">上一版</a></p>
</main>
<script>
const $=id=>document.getElementById(id), durations={sword:.86,spear:.82,bow:1.08};
let playing=false,time=0,last=0,cache={};
function setFrame(n){n=Math.max(0,Math.min(31,n));$('scrub').value=n;$('frame').textContent=String(n+1).padStart(2,'0')+' / 32';$('movie').src=`previews/${$('weapon').value}-${String(n).padStart(2,'0')}.png`;}
function pause(){playing=false;$('play').textContent='播放';}
async function preload(){let w=$('weapon').value;if(!cache[w])cache[w]=Promise.all(Array.from({length:32},(_,i)=>new Promise((resolve,reject)=>{let im=new Image();im.onload=resolve;im.onerror=reject;im.src=`previews/${w}-${String(i).padStart(2,'0')}.png`;})));await cache[w];}
document.querySelectorAll('[data-tab]').forEach(button=>button.onclick=()=>{pause();document.querySelectorAll('[data-tab]').forEach(b=>{let active=b===button;b.setAttribute('aria-pressed',active);$(b.dataset.tab).hidden=!active;});});
$('appearance').onchange=()=>$('overview').src=`previews/${$('appearance').value}.png`;
$('weapon').onchange=()=>{pause();time=0;setFrame(0);$('block').src=`previews/${$('weapon').value}-block.png`;$('miss').src=`previews/${$('weapon').value}-miss.png`;preload().catch(()=>{$('frame').textContent='载入失败';});};
$('play').onclick=async()=>{if(playing){pause();return;}try{await preload();playing=true;last=performance.now();$('play').textContent='暂停';}catch{$('frame').textContent='载入失败';}};
$('restart').onclick=()=>{pause();time=0;setFrame(0);};
$('scrub').oninput=()=>{pause();time=Number($('scrub').value)/31*durations[$('weapon').value];setFrame(Number($('scrub').value));};
function tick(now){if(playing){const d=durations[$('weapon').value];time+=(now-last)/1000*Number($('speed').value);if(time>d+.65)time=0;setFrame(Math.round(Math.min(time/d,1)*31));}last=now;requestAnimationFrame(tick);}requestAnimationFrame(tick);
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
</script></html>
